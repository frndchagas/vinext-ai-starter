openapi: 3.1.0
info:
  title: Vinext AI Starter API
  version: 0.0.0
tags:
  - name: Auth
  - name: Identity
  - name: Infrastructure
paths:
  /api/v1/auth/email/verification-notification:
    post:
      operationId: resendEmailVerification
      description: Resend the email verification notification to the authenticated user.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
  /api/v1/auth/login:
    post:
      operationId: login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
  /api/v1/auth/register:
    post:
      operationId: register
      description: Register a new user. Controlled by the registration feature flag.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
                - token
                - email
                - password
                - password_confirmation
  /api/v1/me:
    get:
      operationId: getMe
      description: Current authenticated identity with roles, permissions and verification state.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Identity
  /sanctum/csrf-cookie:
    get:
      operationId: getCsrfCookie
      description: Issue the CSRF cookie required before state-changing requests.
      parameters: []
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
      tags:
        - Infrastructure
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        remember:
          type: boolean
    LoginResult:
      type: object
      required:
        - two_factor
      properties:
        two_factor:
          type: boolean
    Me:
      type: object
      required:
        - id
        - name
        - email
        - email_verified
        - roles
        - permissions
      properties:
        id:
          type: string
          description: Opaque identifier. Clients must not infer meaning from its value.
        name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      description: The authenticated identity, its roles and permissions.
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
      description: RFC 9457 problem details.
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        password_confirmation:
          type: string
    StatusMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ValidationProblem:
      type: object
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        errors:
          type: object
          unevaluatedProperties:
            type: array
            items:
              type: string
      description: RFC 9457 problem details with a stable map of field validation errors.
