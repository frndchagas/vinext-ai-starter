name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, pcntl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - run: bun install --frozen-lockfile
      - run: composer install --working-dir apps/api --no-interaction --prefer-dist

      - name: Contracts drift
        run: bun run contracts:check

      - name: Quality gate
        run: bun run check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.10-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: starter
      DB_USERNAME: starter
      DB_PASSWORD: starter
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, pcntl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - run: composer install --working-dir apps/api --no-interaction --prefer-dist

      - name: Migrations from scratch
        working-directory: apps/api
        run: php artisan migrate --force --env=testing

      - name: Feature suite against real services
        working-directory: apps/api
        run: php artisan test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Detect breaking API changes
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with:
          base: base/contracts/http/openapi/openapi.yaml
          revision: contracts/http/openapi/openapi.yaml
          fail-on-diff: true
