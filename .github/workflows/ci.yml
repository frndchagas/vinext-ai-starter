name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, pcntl
          coverage: none
          tools: composer:2.10.0

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - run: bun ci
      - run: composer install --working-dir apps/api --no-interaction --prefer-dist

      - name: Dependency audit
        run: bun run audit

      - name: Prepare application key
        working-directory: apps/api
        run: cp .env.example .env && php artisan key:generate

      - name: Contracts drift
        run: bun run contracts:check

      - name: Quality gate
        run: bun run check

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.10-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: starter
      DB_USERNAME: starter
      DB_PASSWORD: starter
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
          tools: composer:2.10.0

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - run: composer install --working-dir apps/api --no-interaction --prefer-dist

      - name: Prepare application key
        working-directory: apps/api
        run: cp .env.example .env && php artisan key:generate

      - name: Migrations from scratch
        working-directory: apps/api
        run: php artisan migrate --force --env=testing

      - name: Feature suite against real services
        working-directory: apps/api
        run: php artisan test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
          tools: composer:2.10.0

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - run: bun ci
      - run: composer install --working-dir apps/api --no-interaction --prefer-dist
      - run: bunx playwright install --with-deps chromium

      - name: Prepare application key
        working-directory: apps/api
        run: cp .env.example .env && php artisan key:generate

      - name: Start test infrastructure
        run: bun run infra:up

      - name: Migrate the browser database
        working-directory: apps/api
        run: php artisan migrate --seed --force

      - name: Start the development stack
        run: |
          TASK_SIMULATED_DELAY_MS=1500 bun run dev > "$RUNNER_TEMP/vinext-ai-starter-dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vinext-ai-starter-dev.pid"

          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:13000/up > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          sed -n '1,240p' "$RUNNER_TEMP/vinext-ai-starter-dev.log"
          exit 1

      - name: Browser flows
        run: bun run test:e2e

      - name: Show development logs on failure
        if: failure()
        run: sed -n '1,320p' "$RUNNER_TEMP/vinext-ai-starter-dev.log"

      - name: Stop the development stack
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vinext-ai-starter-dev.pid"; then
            xargs kill < "$RUNNER_TEMP/vinext-ai-starter-dev.pid" || true
          fi
          docker compose down

  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
          tools: composer:2.10.0

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: template-composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - name: Fresh template
        run: bun run test:template

  distribution-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, redis, pcntl
          coverage: none
          tools: composer:2.10.0

      - run: bun ci
      - run: composer install --working-dir apps/api --no-interaction --prefer-dist
      - run: bun run test:distribution

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Production topology
        run: bash scripts/production-smoke.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Detect breaking API changes
        uses: oasdiff/oasdiff-action/breaking@1c611ffb1253a72924624aa4fb662e302b3565d3 # v0.0.21
        with:
          base: base/contracts/http/openapi/openapi.yaml
          revision: contracts/http/openapi/openapi.yaml
          fail-on-diff: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
